<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="description" content="Selected film, commercial and music video work by Yoanna Zabcheva.">
  <title>Yoanna Zabcheva — Cinematographer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="Back to top">YOANNA<br>ZABCHEVA<span>®</span></a>
    <div class="header-right">
      <span class="descriptor">CINEMATOGRAPHER<br>DIRECTOR</span>
      <a class="contact-link" href="mailto:hello@example.com">GET IN TOUCH <span>↗</span></a>
    </div>
  </header>

  <main>
    <section class="intro" aria-label="Introduction">
      <p class="eyebrow">SELECTED WORK <span>2021 — 2026</span></p>
      <p class="intro-line">Images, people<br>and the spaces between.</p>
      <p class="intro-note">A selection of moving-image work.<br>Available for collaborations worldwide.</p>
    </section>

    <section class="work-grid" id="work" aria-label="Selected video work">
      <!-- Replace the titles, credits and video filenames in script.js. -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-name">YOANNA ZABCHEVA</div>
    <a href="mailto:hello@example.com">HELLO@EXAMPLE.COM ↗</a>
    <span>SOFIA · AVAILABLE WORLDWIDE</span>
    <span class="copyright">© <span id="year"></span></span>
  </footer>

  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close" id="viewerClose" aria-label="Close video">CLOSE <span>×</span></button>
    <button class="viewer-prev" id="viewerPrev" aria-label="Previous video">←</button>
    <video id="viewerVideo" controls playsinline></video>
    <button class="viewer-next" id="viewerNext" aria-label="Next video">→</button>
    <div class="viewer-caption"><span id="viewerTitle"></span><span id="viewerCredit"></span></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
